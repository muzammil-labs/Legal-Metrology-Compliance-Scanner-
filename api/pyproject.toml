[project]
name = "backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<1.0.0",
    "sqlalchemy>=2.0,<3",
    "reportlab>=4.0,<5",
    "uvicorn>=0.30,<1",
    "google-genai>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "openpyxl>=3.1,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
