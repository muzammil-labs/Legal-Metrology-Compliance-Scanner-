[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-metrology-compliance-scanner"
version = "1.0.0"
description = "Legal Metrology Compliance Scanner Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "reportlab>=4.0,<5",
    "uvicorn[standard]>=0.30,<1",
    "google-genai>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "qrcode[pil]>=8.0,<9",
    "openpyxl>=3.1,<4",
    "PyJWT>=2.8.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "pytest-asyncio>=0.21.1,<1.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
